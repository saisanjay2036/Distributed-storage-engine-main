syntax = "proto3";

package dse.metadata;

option cc_enable_arenas = true;

// Metadata service RPCs for object/chunk mapping and cluster state.

message ReplicaLocation {
  string node_id = 1;
  string address = 2;
  bool is_primary = 3;
  uint32 version = 4;
}

message ChunkMetadata {
  string chunk_id = 1;
  string object_id = 2;
  uint32 chunk_index = 3;
  uint64 size = 4;
  string checksum = 5;
  uint32 version = 6;
  repeated ReplicaLocation replicas = 7;
}

message ObjectMetadata {
  string object_id = 1;
  string filename = 2;
  uint64 size = 3;
  uint32 replication_factor = 4;
  uint32 version = 5;
  string checksum = 6;
  string owner = 7;
  uint64 created_at_ms = 8;
  uint64 updated_at_ms = 9;
  repeated ChunkMetadata chunks = 10;
}

message CreateObjectRequest {
  string filename = 1;
  uint64 size = 2;
  uint32 replication_factor = 3;
  string owner = 4;
  uint32 chunk_size_mb = 5;
}

message CreateObjectResponse {
  bool success = 1;
  string message = 2;
  ObjectMetadata object = 3;
}

message DeleteObjectRequest {
  string object_id = 1;
  string filename = 2;
}

message DeleteObjectResponse {
  bool success = 1;
  string message = 2;
}

message LocateObjectRequest {
  string object_id = 1;
  string filename = 2;
}

message LocateObjectResponse {
  bool success = 1;
  string message = 2;
  ObjectMetadata object = 3;
}

message ListObjectsRequest {
  string prefix = 1;
  uint32 limit = 2;
  uint32 offset = 3;
}

message ListObjectsResponse {
  repeated ObjectMetadata objects = 1;
  uint32 total = 2;
}

message UpdateChunkRequest {
  string object_id = 1;
  ChunkMetadata chunk = 2;
}

message UpdateChunkResponse {
  bool success = 1;
  string message = 2;
}

message RegisterNodeRequest {
  string node_id = 1;
  string address = 2;
  uint64 total_bytes = 3;
}

message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
}

message NodeHeartbeatRequest {
  string node_id = 1;
  uint64 timestamp_ms = 2;
  uint64 free_bytes = 3;
  uint64 chunk_count = 4;
}

message NodeHeartbeatResponse {
  bool success = 1;
  string message = 2;
}

message GetClusterStateRequest {}

message ClusterNodeInfo {
  string node_id = 1;
  string address = 2;
  bool online = 3;
  uint64 free_bytes = 4;
  uint64 total_bytes = 5;
  uint64 chunk_count = 6;
  uint64 last_heartbeat_ms = 7;
}

message ClusterState {
  string leader_id = 1;
  uint64 generation = 2;
  repeated ClusterNodeInfo nodes = 3;
  uint32 replication_factor = 4;
}

message GetClusterStateResponse {
  ClusterState state = 1;
}

message SelectNodesRequest {
  uint32 count = 1;
  string strategy = 2;
}

message SelectNodesResponse {
  repeated ClusterNodeInfo nodes = 1;
}

message MarkNodeOfflineRequest {
  string node_id = 1;
}

message MarkNodeOfflineResponse {
  bool success = 1;
  string message = 2;
}

message GetUnderReplicatedChunksRequest {}

message GetUnderReplicatedChunksResponse {
  repeated ChunkMetadata chunks = 1;
}

service MetadataService {
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
  rpc LocateObject(LocateObjectRequest) returns (LocateObjectResponse);
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  rpc UpdateChunk(UpdateChunkRequest) returns (UpdateChunkResponse);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc NodeHeartbeat(NodeHeartbeatRequest) returns (NodeHeartbeatResponse);
  rpc GetClusterState(GetClusterStateRequest) returns (GetClusterStateResponse);
  rpc SelectNodes(SelectNodesRequest) returns (SelectNodesResponse);
  rpc MarkNodeOffline(MarkNodeOfflineRequest) returns (MarkNodeOfflineResponse);
  rpc GetUnderReplicatedChunks(GetUnderReplicatedChunksRequest) returns (GetUnderReplicatedChunksResponse);
}
